services:
  camera-system:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://124.123.100.86:8000
        NEXT_PUBLIC_WS_URL: ws://124.123.100.86:8000
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ${MEDIA_PATH:-./camera-images}:/app/api/media
      - ${DATA_PATH:-./camera-data}:/app/api/data
      # Bind-mount (not devices:) so hot-plugged USB cameras appear live
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - DEBUG=false
      - ESP32_HOST=10.10.2.20
      - USE_GPU=false
    privileged: true
    restart: unless-stopped
