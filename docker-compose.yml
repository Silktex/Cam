services:
  camera-system:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ${MEDIA_PATH:-./camera-images}:/app/api/media
      - ${DATA_PATH:-./camera-data}:/app/api/data
      # Bind-mount (not devices:) so hot-plugged USB cameras appear live
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - ESP32_HOST=10.10.2.20
      - USE_GPU=false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
        tag: "{{.Name}}"
    privileged: true
    restart: unless-stopped
