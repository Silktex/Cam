services:
  camera-system:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ${MEDIA_PATH:-./camera-images}:/app/api/media
      - ${DATA_PATH:-./camera-data}:/app/api/data
    environment:
      - DEBUG=false
      - ESP32_HOST=192.168.0.44
      - USE_GPU=false
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    restart: unless-stopped

