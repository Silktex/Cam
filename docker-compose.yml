services:
  camera-system:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    ports:
      - "3000:3000"
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MEDIA_PATH:-./camera-images}:/app/api/media
      - ${DATA_PATH:-./camera-data}:/app/api/data
      # Bind-mount (not devices:) so hot-plugged USB cameras appear live
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - DEBUG=false
      - ESP32_HOST=192.168.0.44
      - USE_GPU=false
      - MEDIAMTX_HOST=host.docker.internal
    privileged: true
    restart: unless-stopped
