# Fast gate — runs on EVERY push and pull_request, but ONLY on GitHub-hosted
# runners (ubuntu-latest). The self-hosted hardware runner (labels
# self-hosted/ind/hardware) is reserved exclusively for hardware.yml, which
# must never run on push (it actuates the physical camera + light rig).
#
# SECURITY: never switch to `pull_request_target` here — PR head code must not
# be granted access to repo secrets. `pull_request` checks out the merge ref
# with the default read-only token, which is the safe pattern.
#
# Suite mirrors the todo-3 gate convention (forge-progress.md §Gate commands):
# vitest, tsc --noEmit, next build, pytest --collect-only.

name: CI (fast gate)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (vitest + tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build (next build)
        run: NEXT_TELEMETRY_DISABLED=1 npm run build

  api-collect:
    name: API (pytest --collect-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install system libraries (opencv runtime + python-gphoto2 build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgphoto2-dev libusb-1.0-0-dev pkg-config gcc \
            libgl1 libglib2.0-0t64

      - name: Install API dependencies (explicit, CPU torch like the image)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Collect API tests (import smoke — no hardware touched)
        working-directory: api
        run: python -m pytest --collect-only -q
